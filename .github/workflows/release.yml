name: Release

# Push a tag like v0.1.0 to publish signed multi-arch images and the Helm
# chart (OCI) to GHCR, then create a GitHub release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR
  id-token: write # keyless cosign signing via GitHub OIDC
  attestations: write

jobs:
  images:
    name: Publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - { app: api, dockerfile: docker/node-app.Dockerfile }
          - { app: worker, dockerfile: docker/node-app.Dockerfile }
          - { app: web, dockerfile: docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v5
      # Registry paths must be lowercase; repository_owner keeps its casing.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/lifeos-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/${OWNER}/lifeos-${{ matrix.app }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ env.OWNER }}/lifeos-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package and push to oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sed -i "s#^imageRegistry: .*#imageRegistry: ghcr.io/${OWNER}#" deploy/helm/lifeos/values.yaml
          helm package deploy/helm/lifeos --version "$VERSION" --app-version "$VERSION"
          echo '${{ secrets.GITHUB_TOKEN }}' | helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin
          helm push "lifeos-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [images, chart]
    steps:
      - uses: actions/checkout@v5
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          gh release create "$GITHUB_REF_NAME" --generate-notes --notes "$(cat <<EOF
          ## Install

          \`\`\`bash
          helm install lifeos oci://ghcr.io/${OWNER}/charts/lifeos --version ${GITHUB_REF_NAME#v} \\
            --set existingSecret=lifeos-secrets
          \`\`\`

          Images are signed with cosign (keyless) and ship SBOM + SLSA provenance:

          \`\`\`bash
          cosign verify ghcr.io/${OWNER}/lifeos-api:${GITHUB_REF_NAME#v} \\
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          )"
