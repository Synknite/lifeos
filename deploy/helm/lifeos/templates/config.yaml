apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lifeos.fullname" . }}
  labels: {{- include "lifeos.labels" . | nindent 4 }}
# The apps never call the Kubernetes API; don't mount a token they could leak.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lifeos.fullname" . }}-config
  labels: {{- include "lifeos.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  ANTHROPIC_MODEL_SMART: {{ .Values.config.anthropicModelSmart | quote }}
  ANTHROPIC_MODEL_FAST: {{ .Values.config.anthropicModelFast | quote }}
  {{- with .Values.config.ollamaBaseUrl }}
  OLLAMA_BASE_URL: {{ . | quote }}
  {{- end }}
  LLM_DAILY_TOKEN_BUDGET: {{ .Values.config.llmDailyTokenBudget | quote }}
  WEB_ORIGIN: {{ .Values.config.webOrigin | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  APP_URL: {{ .Values.config.appUrl | quote }}
  MAIL_FROM: {{ .Values.config.mailFrom | quote }}
  OTEL_ENABLED: {{ .Values.config.otel.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otel.endpoint | quote }}
  WORKER_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
{{- if and (not .Values.existingSecret) .Values.secretValues }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lifeos.secretName" . }}
  labels: {{- include "lifeos.labels" . | nindent 4 }}
  annotations:
    # Must exist before the pre-install migration hook runs.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretValues }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
