{{- if .Values.gateway.enabled }}
# Gateway API route (the successor to Ingress; works with Envoy Gateway,
# Cilium, Istio, Traefik, GKE/EKS gateways).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "lifeos.fullname" . }}
  labels: {{- include "lifeos.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: {{ include "lifeos.fullname" . }}-api
          port: 80
      # Chat responses are long-lived SSE streams; default proxy timeouts
      # (often 15s) would cut them off.
      timeouts:
        request: {{ .Values.gateway.streamTimeout }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "lifeos.fullname" . }}-web
          port: 80
{{- end }}
