packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency build scripts by default; allow only the ones we need.
# (msgpackr-extract, ssh2 and cpu-features only compile optional native
# speedups and fall back to prebuilt/JS code, so their scripts stay blocked.)
onlyBuiltDependencies:
  - esbuild
  - protobufjs
ignoredBuiltDependencies:
  - cpu-features
  - msgpackr-extract
  - ssh2
